<div class="form-container">
    <div class="form-header">
        <h2>{{ isEditing ? ' Editar Cliente' : ' Nuevo Cliente' }}</h2>
        <span class="form-badge">{{ isEditing ? 'Edición' : 'Creación' }}</span>
    </div>

    <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label>Nombre <span class="required">*</span></label>
            <input type="text" formControlName="nombre_cliente" placeholder="Ingresa el nombre" class="form-control" [class.is-invalid]="clienteForm.get('nombre_cliente')?.invalid && clienteForm.get('nombre_cliente')?.touched">
            <div class="error-message" *ngIf="clienteForm.get('nombre_cliente')?.invalid && clienteForm.get('nombre_cliente')?.touched">⚠️ Requerido (mínimo 3 caracteres)</div>
        </div>

        <div class="form-group">
            <label>Dirección <span class="required">*</span></label>
            <input type="text" formControlName="direccion_cliente" placeholder="Ingresa la dirección" class="form-control" [class.is-invalid]="clienteForm.get('direccion_cliente')?.invalid && clienteForm.get('direccion_cliente')?.touched">
            <div class="error-message" *ngIf="clienteForm.get('direccion_cliente')?.invalid && clienteForm.get('direccion_cliente')?.touched">⚠️ Requerido (mínimo 5 caracteres)</div>
        </div>

        <div class="form-group">
            <label>Teléfono <span class="required">*</span></label>
            <input type="tel" formControlName="telefono" placeholder="Ingresa el teléfono (solo números)" class="form-control" [class.is-invalid]="clienteForm.get('telefono')?.invalid && clienteForm.get('telefono')?.touched">
            <div class="error-message" *ngIf="clienteForm.get('telefono')?.invalid && clienteForm.get('telefono')?.touched">⚠️ Requerido (7-15 dígitos)</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" [disabled]="clienteForm.invalid || isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-btn"></span>
                <span *ngIf="!isSubmitting">{{ isEditing ? ' Actualizar' : ' Guardar' }}</span>
            </button>
            <button type="button" class="btn btn-secondary" (click)="onCancel()">❌ Cancelar</button>
        </div>
    </form>
</div>
