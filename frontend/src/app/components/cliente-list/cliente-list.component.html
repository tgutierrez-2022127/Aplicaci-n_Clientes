<div class="list-container">
    <div class="header">
        <h2> Clientes <span class="badge">{{ clientes.length }}</span></h2>
        <button class="btn-primary" (click)="showNewClienteForm()">➕ Nuevo</button>
    </div>

    <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
    <div *ngIf="error" class="alert error">{{ error }}</div>

    <div *ngIf="loading && !showForm" class="loading">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>

    <div *ngIf="showForm" class="form-wrapper">
        <app-cliente-form 
            [cliente]="selectedCliente"
            (clienteSaved)="onSaveCliente($event)"
            (cancel)="cancelForm()"
            [isSubmitting]="isSubmitting">
        </app-cliente-form>
    </div>

    <table *ngIf="!loading && clientes.length > 0">
        <thead>
            <tr>
                <th>Código</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let cliente of clientes">
                <td>#{{ cliente.codigo_cliente }}</td>
                <td>{{ cliente.nombre_cliente }}</td>
                <td>{{ cliente.direccion_cliente }}</td>
                <td>{{ cliente.telefono }}</td>
                <td>
                    <button class="btn-edit" (click)="editCliente(cliente)"></button>
                    <button class="btn-delete" (click)="deleteCliente(cliente.codigo_cliente!, cliente.nombre_cliente)"></button>
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="!loading && clientes.length === 0" class="empty">
         No hay clientes registrados
    </div>
</div>
